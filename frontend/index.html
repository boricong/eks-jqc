<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FB" />
    <script>
      // Use the tab's last verified identity before app CSS paints; session verification reconciles it.
      (() => {
        let theme = 'light';
        try {
          const actor = sessionStorage.getItem('eks-theme-actor');
          if (actor && localStorage.getItem(`eks-theme:${actor}`) === 'dark') theme = 'dark';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#171721' : '#F4F7FB';
      })();
    </script>
    <title>EKS 직무자격인증</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
